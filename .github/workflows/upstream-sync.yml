# Keep the fork in sync with upstream deepseek-ai/deepseek-harness and publish
# the app releases for each new dsh version on npm.
#
# On schedule (or manual dispatch) this workflow merges upstream master into the
# fork's master and pushes it. It then asks npm for the current @deepseek-ai/dsh
# version; when the fork has no release for it yet, it tags the merged tree
# `dsh-v<version>` and pushes the tag, which triggers app-release.yml to build
# the platform apps and attach them to the GitHub Release for that tag. A tag
# that exists without a release (a previous build failure) is recreated at HEAD
# to re-fire the build. Upstream publishes releases to npm rather than pushing
# dsh-v* tags, so npm is the release signal.
name: Sync upstream and release macOS app

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      sync_only:
        description: Merge upstream master and push, without touching releases.
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness

jobs:
  sync:
    name: Sync upstream and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Merge upstream master into the fork
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream master
          if git merge --no-edit upstream/master; then
            echo "upstream merged"
          else
            git merge --abort
            echo "::error::Merging upstream/master into master failed with conflicts; resolve them manually."
            exit 1
          fi
          git push origin master

      - name: Publish the macOS release for the current dsh version
        if: ${{ !inputs.sync_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(npm view @deepseek-ai/dsh version)"
          TAG="dsh-v${VERSION}"
          SHA="$(git rev-parse HEAD)"
          echo "current @deepseek-ai/dsh version: ${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to publish."
            exit 0
          fi
          # Creating a tag ref via the API fires the same tag push event as a
          # git push; a tag that exists without a release (a previous build
          # failure) is deleted first so the event fires again.
          if gh api "repos/${GH_REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} exists without a release; recreating it at HEAD to re-trigger the build."
            gh api --method DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}" >/dev/null
          fi
          gh api --method POST "repos/${GH_REPO}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${SHA}"
          echo "Tag ${TAG} created at ${SHA}; macos-app-release.yml is building the release."

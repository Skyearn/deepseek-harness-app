# Keep the fork in sync with upstream deepseek-ai/deepseek-harness and publish
# the app releases for each new dsh version on npm.
#
# On schedule (or manual dispatch) this workflow merges upstream master into the
# fork's master and pushes it. It then asks npm for the current @deepseek-ai/dsh
# version; when it differs from the recorded apps/dsh-version, it bumps the app
# version (apps/version, patch +1), records the new dsh version, and tags the
# merged tree `app-v<version>`, which triggers app-release.yml to build the
# platform apps and attach them to the GitHub Release for that tag. A tag
# that exists without a release (a previous build failure) is recreated at HEAD
# to re-fire the build. Upstream publishes releases to npm rather than pushing
# app-v* tags, so npm is the release signal.
name: Sync upstream and release macOS app

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      sync_only:
        description: Merge upstream master and push, without touching releases.
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness

jobs:
  sync:
    name: Sync upstream and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Merge upstream master into the fork
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream master
          if git merge --no-edit upstream/master; then
            echo "upstream merged"
          else
            # The fork owns the packaging README pair (root README.md/.zh.md and
            # its pairing record): when those conflict, keep the fork's side.
            # Any OTHER conflict still fails the sync.
            if git ls-files --unmerged -- README.md README.zh.md README.i18n.yaml | grep -q .; then
              git checkout --ours -- README.md README.zh.md README.i18n.yaml
              git add README.md README.zh.md README.i18n.yaml
              echo "packaging README kept from the fork"
            fi
            if git diff --name-only --diff-filter=U | grep -q .; then
              git merge --abort
              echo "::error::Merging upstream/master into master failed with conflicts outside the packaging README; resolve them manually."
              exit 1
            fi
            git commit --no-edit
            echo "upstream merged"
          fi
          git push origin master

      - name: Publish the app release for the current dsh version
        if: ${{ !inputs.sync_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DSH_VERSION="$(npm view @deepseek-ai/dsh version)"
          BUNDLED="$(cat apps/dsh-version)"
          echo "current @deepseek-ai/dsh version: ${DSH_VERSION} (last bundled: ${BUNDLED})"
          if [[ "${DSH_VERSION}" == "${BUNDLED}" ]]; then
            echo "dsh unchanged; nothing to publish."
            exit 0
          fi
          # The app shell version is independent of the bundled dsh: apps/version
          # is bumped by one patch whenever the bundled dsh changes (this step),
          # or manually for shell-only releases.
          APP_VERSION="$(cat apps/version)"
          NEW_VERSION="$(node -e "
            const [maj, min, patch] = '${APP_VERSION}'.split('.').map(Number);
            console.log([maj, min, patch + 1].join('.'));
          ")"
          echo "bumping app version ${APP_VERSION} -> ${NEW_VERSION}"
          echo "${NEW_VERSION}" > apps/version
          echo "${DSH_VERSION}" > apps/dsh-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/version apps/dsh-version
          git commit -m "chore(release): bump app version to ${NEW_VERSION} (bundles dsh ${DSH_VERSION})"
          git push origin master
          TAG="app-v${NEW_VERSION}"
          SHA="$(git rev-parse HEAD)"
          # Push the tag through git: API-created refs do not trigger tag-push
          # Actions when using GITHUB_TOKEN. If a previous build left the tag
          # without a release, delete it first so the event fires again.
          if gh api "repos/${GH_REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} exists without a release; recreating it at HEAD to re-trigger the build."
            gh api --method DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}" >/dev/null
          fi
          git tag -f "${TAG}" HEAD
          git push origin "${TAG}"
          echo "Tag ${TAG} pushed at ${SHA}; app-release.yml is building the release."

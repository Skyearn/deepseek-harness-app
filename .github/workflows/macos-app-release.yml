# Build the DeepSeek Harness macOS app shell and attach it to a GitHub Release.
#
# Build runs without credentials on every pull request and master push so a
# pull request proves the app still assembles. Publishing attaches the
# universal .app zip to the GitHub Release for the tag: automatically on a
# dsh-v* tag push, or on manual dispatch with publish=true (which must also run
# from a dsh-v* tag). The bundled build embeds @deepseek-ai/dsh at the exact
# tagged version, so that version must be published to npm first.
name: macOS App Release

on:
  pull_request:
  push:
    branches: [master]
    tags: ['dsh-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the built app to a GitHub Release. Must run from a dsh-v* tag.
        required: true
        type: boolean
        default: false
      bundle_dsh:
        description: Embed @deepseek-ai/dsh into the app (self-contained; needs the version published on npm).
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build DeepSeek Harness.app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Derive version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#dsh-v}"
          else
            VERSION="$(node -p "JSON.parse(require('fs').readFileSync('apps/cli/package.json', 'utf8')).version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Derived version: ${VERSION}"

      - name: Decide bundling
        id: decide
        run: |
          RELEASE_PUSH="${{ github.event_name == 'push' && github.ref_type == 'tag' }}"
          if [[ "$RELEASE_PUSH" == "true" || "${{ inputs.publish }}" == "true" || "${{ inputs.bundle_dsh }}" == "true" ]]; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app (universal)
        env:
          DSH_BUNDLE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARGS=(--universal)
          if [[ "${{ steps.decide.outputs.bundle }}" == "true" ]]; then
            ARGS+=(--bundle-dsh)
          fi
          apps/macos/build.sh "${ARGS[@]}"

      - name: Verify the bundle
        run: |
          APP="apps/macos/build/DeepSeek Harness.app"
          codesign -dv "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          lipo -info "$APP/Contents/MacOS/DeepSeek Harness" | grep -q "x86_64"
          lipo -info "$APP/Contents/MacOS/DeepSeek Harness" | grep -q "arm64"
          if [[ "${{ steps.decide.outputs.bundle }}" == "true" ]]; then
            test -x "$APP/Contents/Resources/dsh/node_modules/.bin/dsh"
          fi
          "$APP/Contents/MacOS/DeepSeek Harness" --resolve

      - name: Zip the app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd apps/macos/build
          ditto -c -k --sequesterRsrc --keepParent "DeepSeek Harness.app" "DeepSeek-Harness-${VERSION}-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-macos
          path: apps/macos/build/DeepSeek-Harness-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to GitHub Release
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' || inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a dsh-v* tag for publishing
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Publishing to a GitHub Release requires running from a dsh-v* tag (current ref: $GITHUB_REF_NAME)."
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: DeepSeek-Harness-macos
          path: dist

      - name: Attach the app to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#dsh-v}"
          ZIP="dist/DeepSeek-Harness-${VERSION}-macos-universal.zip"
          test -f "$ZIP" || { echo "::error::expected asset $ZIP not found"; exit 1; }
          NOTES="DeepSeek Harness ${VERSION} for macOS (universal binary: Apple Silicon + Intel)."
          NOTES+=$'\n\n- The app launches `dsh web` unchanged and releases its port on quit.'
          NOTES+=$'\n- Signed ad-hoc (not notarized): if Gatekeeper objects on first launch, right-click the app and choose Open.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "DeepSeek Harness ${VERSION}" --notes "$NOTES"
          fi

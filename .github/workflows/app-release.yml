# Build the DeepSeek Harness app shells (macOS and Windows) and attach them to
# a GitHub Release.
#
# Build runs without credentials on every pull request and master push so a
# pull request proves the apps still assemble. Publishing attaches the
# platform zips to the GitHub Release for the tag: automatically on an app-v*
# tag push, or on manual dispatch with publish=true (which must also run from
# an app-v* tag). The bundled builds embed @deepseek-ai/dsh at the version
# recorded in apps/dsh-version on the tag, so that version must be published
# to npm first.
name: App Release

on:
  pull_request:
  push:
    branches: [master]
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the built apps to a GitHub Release. Must run from an app-v* tag.
        required: true
        type: boolean
        default: false
      bundle_dsh:
        description: Embed @deepseek-ai/dsh into the apps (self-contained; needs the version published on npm).
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build DeepSeek Harness.app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Derive version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # app-v<appver> tags carry the app shell version; the bundled
            # @deepseek-ai/dsh is recorded in apps/dsh-version on the tag.
            VERSION="${GITHUB_REF_NAME#app-v}"
          else
            VERSION="$(cat apps/version)"
          fi
          DSH_VERSION="$(cat apps/dsh-version)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dsh-version=${DSH_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Derived app version: ${VERSION} (bundling dsh ${DSH_VERSION})"

      - name: Decide bundling
        id: decide
        run: |
          if [[ "${{ inputs.bundle_dsh }}" == "true" ]]; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app (universal)
        env:
          DSH_BUNDLE_VERSION: ${{ steps.version.outputs.dsh-version }}
        run: |
          ARGS=(--universal)
          if [[ "${{ steps.decide.outputs.bundle }}" == "true" ]]; then
            ARGS+=(--bundle-dsh)
          fi
          apps/macos/build.sh "${ARGS[@]}"

      - name: Verify the bundle
        run: |
          APP="apps/macos/build/DeepSeek Harness.app"
          codesign -dv "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          lipo -info "$APP/Contents/MacOS/DeepSeek Harness" | grep -q "x86_64"
          lipo -info "$APP/Contents/MacOS/DeepSeek Harness" | grep -q "arm64"
          if [[ "${{ steps.decide.outputs.bundle }}" == "true" ]]; then
            test -x "$APP/Contents/Resources/dsh/node_modules/.bin/dsh"
            test -x "$APP/Contents/Resources/dsh/bin/node"
          fi
          "$APP/Contents/MacOS/DeepSeek Harness" --resolve

      - name: Run the lifecycle test
        if: ${{ steps.decide.outputs.bundle == 'true' }}
        run: apps/macos/scripts/test-lifecycle.sh

      - name: Zip the app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd apps/macos/build
          ditto -c -k --sequesterRsrc --keepParent "DeepSeek Harness.app" "DeepSeek-Harness-${VERSION}-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-macos
          path: apps/macos/build/DeepSeek-Harness-*.zip
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build DeepSeek Harness.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Derive version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # app-v<appver> tags carry the app shell version; the bundled
            # @deepseek-ai/dsh is recorded in apps/dsh-version on the tag.
            VERSION="${GITHUB_REF_NAME#app-v}"
          else
            VERSION="$(cat apps/version)"
          fi
          DSH_VERSION="$(cat apps/dsh-version)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dsh-version=${DSH_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Derived app version: ${VERSION} (bundling dsh ${DSH_VERSION})"

      - name: Decide bundling
        id: decide
        shell: bash
        run: |
          if [[ "${{ inputs.bundle_dsh }}" == "true" ]]; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app
        shell: bash
        env:
          DSH_BUNDLE_VERSION: ${{ steps.version.outputs.dsh-version }}
        run: |
          ARGS=()
          if [[ "${{ steps.decide.outputs.bundle }}" == "true" ]]; then
            ARGS+=(-BundleDsh)
          fi
          powershell -ExecutionPolicy Bypass -File apps/windows/build.ps1 "${ARGS[@]}"

      - name: Verify the app
        shell: bash
        run: |
          EXE="apps/windows/build/DeepSeek Harness.exe"
          test -f "$EXE"
          test -f "apps/windows/build/Microsoft.Web.WebView2.Core.dll"
          test -f "apps/windows/build/Microsoft.Web.WebView2.WinForms.dll"
          test -f "apps/windows/build/WebView2Loader.dll"
          test -f "apps/windows/Resources/app.ico"
          if [[ "${{ steps.decide.outputs.bundle }}" == "true" ]]; then
            test -f "apps/windows/build/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
            test -f "apps/windows/build/node/node.exe"
            "$EXE" --resolve
          fi

      - name: Run the lifecycle test
        if: ${{ steps.decide.outputs.bundle == 'true' }}
        shell: pwsh
        run: apps/windows/scripts/test-lifecycle.ps1

      - name: Zip the app
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd apps/windows/build
          ITEMS=("'DeepSeek Harness.exe'" "'Microsoft.Web.WebView2.Core.dll'" "'Microsoft.Web.WebView2.WinForms.dll'" "'WebView2Loader.dll'")
          if [[ -d dsh ]]; then
            ITEMS+=("'dsh'")
          fi
          if [[ -d node ]]; then
            ITEMS+=("'node'")
          fi
          LIST=$(IFS=,; echo "${ITEMS[*]}")
          powershell -Command "Compress-Archive -Path $LIST -DestinationPath 'DeepSeek-Harness-${VERSION}-windows-x64.zip' -Force"

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-windows
          path: apps/windows/build/DeepSeek-Harness-*.zip
          if-no-files-found: error
          retention-days: 7

  build-runtime-macos:
    name: Build runtime bundle (macOS)
    needs: []
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Derive dsh version
        id: version
        run: echo "dsh=$(cat apps/dsh-version)" >> "$GITHUB_OUTPUT"
      - name: Build runtime bundle
        run: bash scripts/build-runtime-macos.sh "${{ steps.version.outputs.dsh }}" dist/dsh-runtime-${{ steps.version.outputs.dsh }}-macos-universal.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-runtime-macos
          path: dist/dsh-runtime-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-runtime-windows:
    name: Build runtime bundle (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Derive dsh version
        id: version
        shell: bash
        run: echo "dsh=$(cat apps/dsh-version)" >> "$GITHUB_OUTPUT"
      - name: Build runtime bundle
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-runtime-windows.ps1 -DshVersion "${{ steps.version.outputs.dsh }}" -Out "dist/dsh-runtime-${{ steps.version.outputs.dsh }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-runtime-windows
          path: dist/dsh-runtime-*.zip
          if-no-files-found: error
          retention-days: 7


  publish:
    name: Publish to GitHub Release
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' || inputs.publish }}
    needs: [build-macos, build-windows, build-runtime-macos, build-runtime-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require an app-v* tag for publishing
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Publishing to a GitHub Release requires running from an app-v* tag (current ref: $GITHUB_REF_NAME)."
          exit 1

      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          pattern: DeepSeek-Harness-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-runtime-*
          path: dist
          merge-multiple: true

      - name: Attach the apps to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          # gh discovers the repository from git by default; this job has no
          # git config, so name the repository explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#app-v}"
          DSH_VERSION="$(cat apps/dsh-version)"
          if [[ -z "$(ls dist/*.zip dist/*.tar.gz 2>/dev/null)" ]]; then
            echo "::error::no platform/runtime assets found under dist/"
            exit 1
          fi
          NOTES="DeepSeek Harness ${VERSION} for macOS (universal binary: Apple Silicon + Intel) and Windows (x64)."
          NOTES+=$'\n\n- Shell-only build: the dsh core and Node runtime are downloaded on first launch from upstream npm/nodejs.org.'
          NOTES+=$'\n- Each app launches `dsh web` unchanged and releases its port on quit.'
          NOTES+=$'\n- macOS builds are signed ad-hoc (not notarized): if Gatekeeper objects on first launch, right-click the app and choose Open.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.tar.gz --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.tar.gz --title "DeepSeek Harness ${VERSION}" --notes "$NOTES"
          fi
          # A tag deleted and recreated (tag moves) leaves the release untagged
          # and draft; publish it so the asset is visible.
          gh release edit "$TAG" --draft=false >/dev/null 2>&1 || true
